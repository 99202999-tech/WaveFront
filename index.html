<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavefront</title>
    <style>
      :root{--bg:#09090b;--panel:#18181b;--panel2:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--accent:#22c55e;--border:#3f3f46}
      *{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}body{min-height:100vh;padding:32px 20px}.container{max-width:900px;margin:auto}.header{margin-bottom:24px}.header h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem)}.header p{margin:0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}.upload-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}input[type=file]{flex:1 1 260px;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text)}button{background:var(--accent);color:#052e16;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#status{min-height:24px;margin-top:14px;color:var(--muted)}#filesList{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}#filesList li{display:flex;justify-content:space-between;gap:16px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}#filesList a{color:#7dd3fc;text-decoration:none;overflow-wrap:anywhere}#filesList small{color:var(--muted);white-space:nowrap}@media(max-width:640px){#filesList li{flex-direction:column}}
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header"><h1>Wavefront</h1><p>Jouw muziek en video, jouw browser.</p></header>
      <main class="card">
        <div class="upload-row"><input id="fileInput" type="file" accept="audio/*,video/*" /><button id="uploadBtn" type="button">Uploaden</button></div>
        <p id="status" role="status" aria-live="polite"></p>
        <ul id="filesList"></ul>
      </main>
    </div>
    <script src="./supabase-upload.js" defer></script>
  </body>
</html>
